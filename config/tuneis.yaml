# Configuração do monitoramento de túneis — COR Rio
#
# Fonte: feed de trânsito do Waze for Cities (alertas + congestionamentos). O tempo de
# travessia de cada sentido é estimado como:
#     tempo de fluxo livre (comprimento_m / velocidade_max_kmh)
#   + soma dos atrasos ("delay") dos congestionamentos no túnel e na fila de acesso
# Um congestionamento conta para o túnel quando a via (street) ou o fim do trecho (endNode)
# casa com `waze_rua` (regex), está a até 3 km do túnel e vai no mesmo sentido da rota.
# Para conferir os nomes usados pelo Waze: python -m tuneis waze-rotas
#
# `coords` (lat, lon) definem o sentido e o desenho no mapa: a 1ª rota percorre os pontos
# na ordem; `invertido: true` percorre ao contrário.
# Se o feed for do tipo Traffic View (rotas), use `waze_route_id` / `waze_nome` por rota.
# `pico_sim` (manha | tarde | ambos | nenhum) só é usado pelo simulador.

coleta:
  intervalo_s: 120          # o feed do Waze atualiza a cada ~1-2 min
  dado_ausente_min: 10      # sem leitura nova há mais que isso -> "SEM DADOS"
  db: data/tuneis.db
  pasta_feeds: data/feeds   # JSON bruto de cada leitura (compactado), uma subpasta por feed e por dia
  dias_feeds: 7             # apaga o que for mais antigo que isso (~180 MB/dia com o feed dos túneis)

# Feed Traffic View (rotas): rotas cujo `name` casa com `filtro_nome` entram sozinhas no
# monitoramento, sem precisar estar na lista `tuneis` abaixo. Nome no padrão
# "Rota: <túnel> - Sentido <destino>": os sentidos do mesmo túnel viram um só trecho no painel.
feed_rotas:
  # Só os túneis em si: "Rota: Túnel X" ou "Rota: Túnel X - Sentido Y". Ficam de fora os corredores
  # que citam um túnel, como "Rota: Túnel Santa Bárbara (Laranjeiras - S. Centro) - ... - Via Pres Vargas".
  # Mais a Ponte Rio-Niterói ("BR-101 N/S Ponte Rio-Niterói - <destino>", feed de WAZE_TVT_FEED_URL_EXTRA).
  filtro_nome: '^Rota:\s*T[uú]nel\b(?!.*\()(?!.*\s-\s+Via\b)|Ponte Rio-Niter[oó]i'
  velocidade_livre_kmh: 60     # o feed não traz o fluxo livre: extensão / esta velocidade
  incluir_tuneis_yaml: false   # true = monitora também a lista `tuneis` (feed de trânsito)
  # Túneis fora do painel (regex no `name` do feed), mesmo passando no `filtro_nome` acima.
  # Trechos curtos ou sem utilidade para a sala de operação: tirar daqui os devolve ao painel.
  excluir:
    - 'T[uú]nel Velho|Alaor Prata'
    - 'T[uú]nel Novo|Coelho Cintra'
    - 'Noel Rosa'
    - 'Nina Rabha'
    - 'Major Vaz'
    - 'Jo[aã]o Ricardo'
    - 'Rua Alice'
    - 'Rio 450'
  # Rotas que devem cair no mesmo cartão de outra rota, mesmo com o nome fora do padrão
  # "Rota: <túnel> - Sentido <destino>". `tunel` é o nome que define o cartão (as rotas com o
  # mesmo `tunel` ficam juntas); `sentido` é o rótulo exibido no cartão e no gráfico.
  # A rota entra no painel por aqui mesmo que não case com o `filtro_nome` acima, com ou sem
  # geometria (`line`) no feed — rota recém-criada no Partner Hub pode chegar sem ela.
  agrupar:
    # as duas mãos do Marcello Alencar no mesmo cartão: Aterro + Rodoviária
    - nome: 'Alencar.*Aterro|Aterro.*Alencar'
      tunel: Túnel Marcello Alencar
      sentido: Aterro
    - nome: 'Alencar.*(Rodovi[aá]ri[ao]|Novo Rio)|(Rodovi[aá]ri[ao]|Novo Rio).*Alencar'
      tunel: Túnel Marcello Alencar
      sentido: Rodoviária

# Parâmetros de detecção (globais; podem ser sobrescritos por túnel ou por rota)
deteccao:
  janela_baseline_semanas: 8   # histórico usado para a referência
  min_amostras: 20             # mínimo de amostras no slot para usar o histórico próprio
  razao_atencao: 1.4           # tempo >= 1,4x a referência ...
  z_atencao: 3.0               # ... E >= 3 desvios robustos acima
  razao_critico: 2.0
  z_critico: 4.0
  leituras_para_abrir: 2       # leituras anômalas consecutivas para abrir alerta (~4 min)
  leituras_para_fechar: 3      # leituras normais consecutivas para encerrar (~6 min)
  piso_dispersao_frac: 0.10    # dispersão mínima = 10% da referência ...
  piso_dispersao_s: 10         # ... e nunca menos que 10 s
  min_dias: 3                  # dias distintos de histórico no slot para usá-lo como referência
  alertar_sem_historico: false # sem histórico (calibrando), só alerta interdição

tuneis:
