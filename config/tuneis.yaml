    nome: Túnel Rebouças
    waze_rua: 'T[uú]nel (Ant[oô]nio |Andr[eé] )?Rebou[cç]as'  # no Waze: "Túnel André Rebouças"
    comprimento_m: 2800
    velocidade_max_kmh: 80
    coords: [[-22.9268, -43.2047], [-22.9405, -43.1996], [-22.9575, -43.2047]]
    rotas:
      - id: reboucas_lagoa
        sentido: Rio Comprido → Lagoa
        pico_sim: tarde
        waze_route_id: null
      - id: reboucas_rio_comprido
